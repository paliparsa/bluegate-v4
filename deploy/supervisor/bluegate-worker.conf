[program:bluegate-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bluegate/artisan queue:work redis --sleep=2 --tries=3 --timeout=120 --queue=payments,provisioning,node-sync,usage,notifications,default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/bluegate/storage/logs/worker.log
stopwaitsecs=360
